[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aligner-cli"
version = "0.1.0"
description = "Vertically align assignments, key/value pairs, trailing comments and Markdown tables across many languages."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ShaheerSaud2004" }]
keywords = ["formatter", "alignment", "cli", "markdown", "pre-commit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Filters",
]

[project.urls]
Homepage = "https://github.com/ShaheerSaud2004/Aligner1"
Issues = "https://github.com/ShaheerSaud2004/Aligner1/issues"

[project.scripts]
aligner = "aligner.cli:main"

[tool.setuptools.packages.find]
include = ["aligner*"]
